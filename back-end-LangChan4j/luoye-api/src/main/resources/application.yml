# 落叶（LuoYe）后端应用配置
# 敏感信息一律通过环境变量注入，勿提交明文密钥。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: luoye-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/luoye}
    username: ${DB_USERNAME:luoye}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 表结构由 Flyway 迁移管理；数据访问使用 MyBatis-Plus。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}   # 知识库单文件上限（§3.5 评审项）
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.luoye.dao.entity
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true     # 下划线列名自动映射驼峰字段
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid                # UUID 主键由 MP 分配；不启用自动逻辑删除

# LangChain4j 模型供应商（§7 配置管理）
# 支持多模型并行：对话 chat.model / 嵌入 embedding.model 可分别配置
langchain4j:
  chat:
    provider: ${LLM_CHAT_PROVIDER:openai-compatible}   # openai-compatible | ollama
    base-url: ${LLM_CHAT_BASE_URL:}
    api-key: ${LLM_CHAT_API_KEY:}                      # 从环境变量注入
    model: ${LLM_CHAT_MODEL:}
    temperature: ${LLM_CHAT_TEMPERATURE:0.7}
    timeout-seconds: ${LLM_CHAT_TIMEOUT:60}
  embedding:
    provider: ${LLM_EMBEDDING_PROVIDER:openai-compatible}
    base-url: ${LLM_EMBEDDING_BASE_URL:}
    api-key: ${LLM_EMBEDDING_API_KEY:}
    model: ${LLM_EMBEDDING_MODEL:}
    dimension: ${LLM_EMBEDDING_DIMENSION:1536}         # V1 固定 1536；变更必须新增迁移并重建嵌入
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434} # 本地降级路径（N17）

# JWT（§9 单用户认证最小方案）
luoye:
  security:
    jwt:
      secret: ${LUOYE_JWT_SECRET:}                     # HS256 密钥，至少 32 字符
      exp-hours: ${LUOYE_JWT_EXP_HOURS:1}
  auth:
    username: ${LUOYE_AUTH_USERNAME:admin}            # 单用户登录名（首启初始化）
    password: ${LUOYE_AUTH_PASSWORD:}                 # 首启初始化用，须在环境变量中提供
  # M1 对话配置
  chat:
    max-messages: ${LUOYE_CHAT_MAX_MESSAGES:20}
    stream-timeout-seconds: ${LUOYE_CHAT_TIMEOUT_SECONDS:120}
    persona: ${LUOYE_CHAT_PERSONA:你是落叶，一位温暖、诚实、有独立判断的个人助手。用中文简洁回答，记不清时坦诚说明。}
